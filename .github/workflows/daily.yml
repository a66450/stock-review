name: Daily Stock Review

on:
  schedule:
    # 盘前: 09:25 CST = 01:25 UTC (周一到周五)
    - cron: '25 1 * * 1-5'
    # 盘后: 15:30 CST = 07:30 UTC (周一到周五)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      job:
        description: '运行哪个脚本?'
        required: true
        type: choice
        default: 'both'
        options:
          - after-market
          - pre-market
          - generate-only
          - both

jobs:
  after-market:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.job == 'after-market' || github.event.inputs.job == 'both' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run after-market fetch
        run: python fetch_after_market.py

      - name: Generate HTML
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.db index.html
          git diff --staged --quiet || (
            git commit -m "auto: 盘后数据更新 $(date +%Y-%m-%d)"
            git push
          )

  pre-market:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.job == 'pre-market' || github.event.inputs.job == 'both' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pre-market fetch
        run: python fetch_pre_market.py

      - name: Generate HTML
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.db index.html
          git diff --staged --quiet || (
            git commit -m "auto: 盘前竞价数据更新 $(date +%Y-%m-%d)"
            git push
          )

  generate-only:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job == 'generate-only' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate HTML
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (
            git commit -m "auto: 页面重新生成 $(date +%Y-%m-%d)"
            git push
          )
