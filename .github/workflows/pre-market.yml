name: Pre Market

on:
  schedule:
    - cron: '20 1 * * 1-5'  # 9:20 BJT
    - cron: '25 1 * * 1-5'  # 9:25 BJT
    - cron: '30 1 * * 1-5'  # 9:30 BJT
    - cron: '35 1 * * 1-5'  # 9:35 BJT
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pre-market fetch
        run: python fetch_pre_market.py

      - name: Generate HTML
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.db index.html
          git diff --staged --quiet || (
            git commit -m "auto: 盘前竞价 $(date +%Y-%m-%d)"
            git push
          )
